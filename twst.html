<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Notebook Grid Layout</title>
  <style>
    /* RESET & BASE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    /* MATH NOTEBOOK CONTAINER */
    .notebook-page {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      border-left: 6px solid #ff4d4d; /* Math copy red margin line */
    }

    .notebook-title {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 1.5rem;
    }

    /* GRID CONTAINER (Math Copy Boxes) */
    .math-grid {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-auto-rows: 60px;
      gap: 0; /* Boxes k darmyan space khatam */
      background-color: #e0e0e0;
      padding: 0; /* Container padding khatam */
      border: 2px solid #333;
    }

    /* INDIVIDUAL EMPTY COLORFUL BOXES */
    .box {
      border-radius: 0; /* Sahi grid look ke liye corners straight kar diye hain */
      transition: transform 0.2s ease;
    }

    .box:hover {
      transform: scale(1.05);
      cursor: pointer;
      z-index: 1; /* Hover karne par box overlap safe rahe */
    }

    /* COLOR VARIATIONS FOR BOXES */
    .box-1  { background-color: #ffadad; }
    .box-2  { background-color: #ffd6a5; }
    .box-3  { background-color: #fdffb6; }
    .box-4  { background-color: #caffbf; }
    .box-5  { background-color: #9bf6ff; }
    .box-6  { background-color: #a0c4ff; }
    .box-7  { background-color: #bdb2ff; }
    .box-8  { background-color: #ffc6ff; }
    .box-9  { background-color: #f7d6e0; }
    .box-10 { background-color: #b3f5d3; }
    .box-11 { background-color: #fde2e4; }
    .box-12 { background-color: #e2ece9; }
  </style>
</head>
<body>

  <div class="notebook-page">
    <h2 class="notebook-title">Math Notebook Grid</h2>

    <!-- GRID LAYOUT (EMPTY BOXES) -->
    <div class="math-grid">
      <div class="box box-1"></div>
      <div class="box box-2"></div>
      <div class="box box-3"></div>
      <div class="box box-4"></div>
      <div class="box box-5"></div>
      <div class="box box-6"></div>
      <div class="box box-7"></div>
      <div class="box box-8"></div>
      <div class="box box-9"></div>
      <div class="box box-10"></div>
      <div class="box box-11"></div>
      <div class="box box-12"></div>
      <div class="box box-1"></div>
      <div class="box box-2"></div>
      <div class="box box-3"></div>
      <div class="box box-4"></div>
      <div class="box box-5"></div>
      <div class="box box-6"></div>
    </div>
  </div>

</body>
</html>
